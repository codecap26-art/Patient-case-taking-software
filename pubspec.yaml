name: patient_case_taking
description: A modern Flutter mobile application for the patient side of the Patient Case Taking healthcare platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing
  go_router: ^14.2.0

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1

  # Local Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI & Presentation
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  file_picker: ^8.0.3
  image_picker: ^1.1.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
